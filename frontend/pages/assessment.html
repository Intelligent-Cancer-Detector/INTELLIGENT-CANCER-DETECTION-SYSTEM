<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinical Assessment | ICDS</title>
    <link rel="stylesheet" href="../css/global.css" />

    <link rel="stylesheet" href="../css/assessment.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-container">
      <!-- SIDEBAR -->
      <div id="sidebar-container"></div>

      <div class="main-content" id="mainContent">
        <!-- HEADER -->
        <div id="header-container"></div>
        <div class="dashboard-content">
          <div class="stepper">
            <div class="step active" id="s1">
              <span><b>Step 1:</b></span> Patient Info
            </div>
            <div class="step" id="s2">
              <span><b>Step 2:</b></span> Symptoms
            </div>
            <div class="step" id="s3">
              <span><b>Step 3:</b></span> Refinement
            </div>
            <div class="step" id="s4">
              <span><b>Step 4:</b></span> Results
            </div>
          </div>

          <div class="card anim-in" id="step1">
            <div class="card-header-flex">
              <h3>Patient Registration</h3>
              <div class="id-badge">
                Patient ID: <strong id="autoPatientId">------</strong>
              </div>
            </div>
            <div class="form-grid">
              <div class="group">
                <label>Full Name</label
                ><input type="text" id="pName" placeholder="Full Name" />
              </div>
              <div class="group">
                <label>Age</label
                ><input type="number" id="pAge" placeholder="Age" />
              </div>
              <div class="group">
                <label>Gender</label
                ><select id="pGender">
                  <option>Male</option>
                  <option>Female</option>
                </select>
              </div>

              <div class="group">
                <label>Contact</label
                ><input type="tel" id="pContact" placeholder="Contact" />
              </div> 
            </div>
            <button class="btn-main" onclick="goToStep(2)">
              Proceed to Symptoms <i class="fas fa-arrow-right"></i>
            </button>
          </div>

          <div class="card hidden anim-in" id="step2">
            <h3>Initial Observations</h3>
            <textarea
              id="sympInput"
              placeholder="Enter findings (e.g., blurred vision, dark spot on iris...)"
            ></textarea>
            <div class="btn-row">
              <button class="btn-sub" onclick="goToStep(1)">Back</button>
              <button class="btn-main" onclick="generateFollowUps()">
                Check Indicators
              </button>
            </div>
          </div>

          <div class="card hidden anim-in" id="step3">
            <h3>Clinical Refinement</h3>
            <div id="dynamicQuestions" class="questions-container"></div>
            <div class="btn-row">
              <button class="btn-sub" onclick="goToStep(2)">Back</button>
              <button class="btn-main" onclick="runFinalAnalysis()">
                Generate Final Diagnosis
              </button>
            </div>
          </div>

          <div class="card hidden anim-in" id="step4">
            <div class="res-header">
              <div>
                <h3 id="resName">...</h3>
                <span
                  id="resIdDisplay"
                  style="color: #64748b; font-size: 0.9em"
                ></span>
              </div>
              <div id="statusBadge" class="badge">Processing...</div>
            </div>

            <div class="results-grid" id="finalProbList"></div>

            <div
              id="saveSection"
              style="
                margin-top: 30px;
                padding-top: 20px;
                border-top: 1px solid #eee;
              "
            >
              <div
                id="saveSuccessMessage"
                class="hidden"
                style="color: #10b981; margin-bottom: 15px; font-weight: 600"
              >
                <i class="fas fa-check-circle"></i> Record successfully archived
                to Supabase!
              </div>

              <div class="btn-row">
                <button
                  id="saveBtn"
                  class="btn-main"
                  onclick="triggerDatabaseSave()"
                >
                  <i class="fas fa-cloud-upload-alt"></i> Save to Patient
                  History
                </button>
                <button class="btn-sub" onclick="window.location.reload()">
                  <i class="fas fa-redo"></i> New Assessment
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../utils/env.js"></script>
    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/header.js"></script>
    <script type="module">
      import { loadLayout } from "../js/loader.js";
      await loadLayout();
    </script>
    <script type="module" src="../js/assessment.js"></script>
  </body>
</html>
